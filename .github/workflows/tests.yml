name: Core tests
on:
  push:
    paths: ['core/**', 'tests/**', '.github/workflows/tests.yml']
  workflow_dispatch:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the core tests
        run: sh tests/run.sh
